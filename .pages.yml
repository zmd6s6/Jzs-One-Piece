  - name: category
    label: 分类
    type: string
    default: finance
    hidden: true
  - name: tags
    label: 标签
    type: string
    list: true
  - name: status
    label: 内容成熟度
    type: select
    default: draft
    description: 用于标记笔记的成熟度；保存后会更新公开网站。
    options:
      values:
      - name: draft
        label: 整理中
      - name: active
        label: 持续更新
      - name: stable
        label: 已稳定
      - name: deprecated
        label: 已过时
  - name: created
    label: 创建日期
    type: date
    options:
      format: yyyy-MM-dd
  - name: updated
    label: 更新日期
    type: date
    description: 修改文章时选择今天的日期。
    options:
      format: yyyy-MM-dd
  - name: body
    label: 正文
    type: rich-text
    required: true
    description: 支持标题、列表、代码块和图片；复杂 Markdown 可切换到 Source 模式。
    options:
      format: markdown
      switcher: true
      media: article_images_deep
